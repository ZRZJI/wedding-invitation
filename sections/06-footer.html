<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 375px;
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: #4a1018; color: rgba(255,255,255,0.6);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 44px 24px;
  font-size: 13px; letter-spacing: 2px; line-height: 2.2;
}
.couple-name {
  font-size: 19px; color: #D4A853; letter-spacing: 7px; margin-bottom: 4px;
}
.diamond {
  width: 10px; height: 10px;
  background: rgba(212,168,83,0.4);
  transform: rotate(45deg); margin: 18px auto;
}
.thanks { margin-top: 6px; }
.sub { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 14px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="couple-name">张睿 &amp; 赵嘉妮</div>
<div class="diamond"></div>
<p class="thanks">感谢您的到来</p>
<p class="sub">Thank You For Coming</p>
</body>
</html>
