<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width: 375px;
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: #faf8f4; color: #3d1c0a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 48px 24px;
}
.title {
  font-size: 22px; letter-spacing: 6px;
  color: #3d1c0a; margin-bottom: 4px; font-weight: 400;
}
.title-en {
  font-size: 11px; letter-spacing: 3px;
  color: #b8a898; margin-bottom: 24px;
}
.hint {
  font-size: 14px; color: #8b7a6a;
  letter-spacing: 2px; line-height: 1.8;
}
</style>
</head>
<body>
<div class="title">确认出席</div>
<div class="title-en">RSVP</div>
<p class="hint">请填写信息<br>方便为您安排席位</p>
</body>
</html>
